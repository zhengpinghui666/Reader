name: Build Native macOS App

on:
  workflow_dispatch:
  push:
    paths:
      - "mac-native/**"
      - ".github/workflows/build-mac-native.yml"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.artifact-suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact-suffix: apple-silicon
            runner: macos-14
            arch: arm64
          - artifact-suffix: intel
            runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build native macOS app bundle
        working-directory: mac-native
        env:
          READER_ARCHES: ${{ matrix.arch }}
          READER_DIST_LABEL: macOS-${{ matrix.artifact-suffix }}
        run: |
          set -o pipefail
          chmod +x build-mac.sh
          ./build-mac.sh 2>&1 | tee build-${{ matrix.artifact-suffix }}.log

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReaderMacNative-macOS-${{ matrix.artifact-suffix }}
          path: |
            mac-native/dist/ReaderMacNative-macOS-${{ matrix.artifact-suffix }}.zip
            mac-native/dist/ReaderMacNative-macOS-${{ matrix.artifact-suffix }}.dmg
            mac-native/dist/ReaderMacNative-macOS-${{ matrix.artifact-suffix }}.pkg
            mac-native/dist/ReaderMacNative-macOS-${{ matrix.artifact-suffix }}.tar.gz
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReaderMacNative-build-log-${{ matrix.artifact-suffix }}
          path: mac-native/build-${{ matrix.artifact-suffix }}.log
          if-no-files-found: ignore

  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ReaderMacNative-macOS-*
          path: release-assets
          merge-multiple: true

      - name: Publish latest macOS release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: reader-mac-native-latest
        run: |
          set -euo pipefail
          exec > >(tee publish-release.log) 2>&1
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          printf '%s\n' "${assets[@]}"
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded."
            exit 1
          fi
          gh release delete "$TAG_NAME" --repo "$GH_REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG_NAME" "${assets[@]}" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "ReaderMacNative macOS latest" \
            --notes "Automated macOS build from ${GITHUB_SHA}. Use apple-silicon for M-series Macs and intel for Intel Macs."

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReaderMacNative-publish-release-log
          path: publish-release.log
          if-no-files-found: ignore
